{% extends "base.html" %}

{% block title %}レシピの編集 - 節約レシピアプリ{% endblock %}

{% block header %}
    <h1>✏️ レシピを編集</h1>
    <p>内容を変更して「更新する」を押してください。</p>
{% endblock %}

{% block content %}
    <style>
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 100px; resize: vertical; }
        .btn-update { background-color: #0066cc; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .btn-update:hover { background-color: #0052a3; }
        .back-link { display: inline-block; margin-top: 15px; color: #666; text-decoration: none; }
    </style>

    <!-- 編集先のURLへPOST送信 -->
    <form action="{{ url_for('edit_recipe', id=recipe.id) }}" method="POST">
        <div class="form-group">
            <label for="title">レシピ名:</label>
            <input type="text" id="title" name="title" value="{{ recipe.title }}" required>
        </div>

        <div class="form-group">
            <label for="ingredients">材料 (カンマ区切りなど):</label>
            <input type="text" id="ingredients" name="ingredients" value="{{ recipe.ingredients }}" required>
        </div>

        <div class="form-group">
            <label for="instructions">作り方:</label>
            <textarea id="instructions" name="instructions" required>{{ recipe.instructions }}</textarea>
        </div>

        <div class="form-group">
            <label for="budget">目安金額 (円):</label>
            <input type="number" id="budget" name="budget" value="{{ recipe.budget }}" required>
        </div>

        <button type="submit" class="btn-update">更新する</button>
    </form>

    <a href="{{ url_for('item_detail', id=recipe.id) }}" class="back-link">← 詳細に戻る</a>
{% endblock %}
