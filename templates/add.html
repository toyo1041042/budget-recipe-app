{% extends "base.html" %}

{% block title %}新しい節約レシピを追加 - 節約レシピアプリ{% endblock %}

{% block header %}
    <h1>🍳 新しい節約レシピを追加</h1>
    <p>材料費や作り方を入力して、マイレシピに登録しましょう！</p>
{% endblock %}

{% block content %}
    <style>
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { height: 100px; resize: vertical; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        button:hover { background-color: #218838; }
    </style>

    <form action="{{ url_for('add_recipe') }}" method="POST">
        <div class="form-group">
            <label for="title">レシピ名:</label>
            <input type="text" id="title" name="title" required placeholder="例: キャベツの芯のスープ">
        </div>

        <div class="form-group">
            <label for="ingredients">材料 (カンマ区切りなど):</label>
            <input type="text" id="ingredients" name="ingredients" required placeholder="例: キャベツの芯, ベーコン, コンソメ">
        </div>

        <div class="form-group">
            <label for="instructions">作り方:</label>
            <textarea id="instructions" name="instructions" required placeholder="1. 芯を薄切りにする&#10;2. 鍋に材料を入れて煮込む"></textarea>
        </div>

        <div class="form-group">
            <label for="budget">目安金額 (円):</label>
            <input type="number" id="budget" name="budget" required placeholder="例: 50">
        </div>

        <button type="submit">レシピを登録する</button>
    </form>

    <p style="margin-top: 20px;">
        <a href="{{ url_for('item_list') }}">← レシピ一覧に戻る</a>
    </p>
{% endblock %}
